pagetitle: Ford Johnson
description-meta: Ford Johnson is a Data Analyst specializing in data visualization and analysis. Explore my portfolio showcasing projects in growth marketing, web analytics, and funnel optimization, turning data into actionable insights.
anchor-sections: false
section-divs: false
page-layout: custom

hero:
  headline: Data to insights, visually driven.
  subtitle: I transform raw data into understandable visuals and meaningful stories, enabling businesses to make informed strategic decisions.
  cta:
    text: Explore my work
    url: /projects/

listing:
  - id: projects-featured
    template: _components/card-grid.ejs
    contents: projects/listing.yml
    template-params:
      showFeaturedOnly: true
      basePath: "projects/"
      showCategory: true


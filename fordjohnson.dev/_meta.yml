hero:
  headline: Turning Data into Insights, One Story at a Time
  subtitle: I transform raw data into compelling visuals and meaningful narratives, helping businesses make smarter decisions.
  cta:
    text: check it out
    url: /
  img-url: _assets/images/profile.jpg
  img-alt: alt text

anchor-sections: false
section-divs: false
page-layout: custom

listing:
  - id: projects-featured
    template: _components/card-grid.ejs
    contents: projects/listing.yml
    template-params:
      showFeaturedOnly: true
      basePath: "projects/"
      showCategory: true

  - id: split-section
    template: _components/split-section.ejs
    contents:
      splitSections:
        - header: Data Storytelling & Visualization
          text: "{{< lipsum >}}"
          img-url: https://raw.githubusercontent.com/bradfordjohnson/tidytuesday/refs/heads/main/tidytuesday/2025/2025-02-18/agencies.png
          img-alt: Example of Data Visualization
          flip: true

        - header: Web & Marketing Analytics
          text: "{{< lipsum >}}"
          img-url: projects/core-pretzel-index/image.jpg
          img-alt: Example of Analytics Dashboard
          flip: false

        - header: Data Storytelling & Visualization
          text: "{{< lipsum >}}"
          img-url: projects/core-pretzel-index/image.jpg
          img-alt: Example of Data Visualization
          flip: true
pagetitle: Ford Johnson
description-meta: Ford Johnson is a Data Analyst specializing in data visualization and analysis. Explore my portfolio showcasing projects in growth marketing, web analytics, and funnel optimization, turning data into actionable insights.
anchor-sections: false
section-divs: false
page-layout: custom

hero:
  headline: Data to insights, visually driven.
  subtitle: I transform raw data into understandable visuals and meaningful stories, enabling businesses to make informed strategic decisions.
  cta:
    text: Explore my work
    url: /projects/

listing:
  - id: projects-featured
    template: _components/card-grid.ejs
    contents: projects/listing.yml
    template-params:
      showFeaturedOnly: true
      basePath: "projects/"
      showCategory: true

  - id: split-section
    template: _components/split-section.ejs
    contents:
      splitSections:
        - header: Visual sensemaking
          text: "I specialize in crafting interactive and insightful data visualizations, including custom visuals tailored to specific needs, that empower stakeholders to understand complex information and drive strategic decisions. My approach focuses on clarity, accuracy, and actionable storytelling, ensuring data becomes a powerful tool for business growth."
          img-url: _assets/images/seinfeld-sentiment.png
          img-alt: An R-generated raincloud plot displays the distribution of sentiment scores for Seinfeld episode scripts. The plot compares the sentiment as analyzed by multiple lexicons, showing how each lexicon interprets the emotional tone of the same text data.
          flip: true

        - header: End-to-end data expertise
          text: "I manage the full data lifecycle, from initial data acquisition and meticulous preparation to the creation of insightful visualizations and comprehensive reports, sometimes leveraging JavaScript for interactive or bespoke visual solutions. My core analysis toolkit includes SQL, R, and Python, enabling me to extract actionable insights from diverse datasets."
          img-url: projects/core-pretzel-index/image.jpg
          img-alt: Example of Analytics Dashboard
          flip: false

        - header: Ensuring data accuracy and reliability
          text: "I prioritize data quality through the implementation of thorough validation techniques. My focus is on ensuring data accuracy and reliability, which is fundamental for generating trustworthy insights."
          img-url: projects/core-pretzel-index/image.jpg
          img-alt: Example of Data Visualization
          flip: true
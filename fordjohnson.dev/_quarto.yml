# build via:
# quarto preview --render all --no-watch-inputs

project:
  type: website
  output-dir: docs

# temp testing
  render: 
    - index.qmd
    - projects/index.qmd
    - notes/index.qmd
    - about/index.qmd

website:
  title: Ford Johnson
  site-url: https://fordjohnson.dev
  search: false
  favicon: _assets/images/favicon.png
  open-graph:
    image: _assets/images/logo-2.png

  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: projects/index.qmd
        text: Projects
      - href: notes/index.qmd
        text: Notes
      - href: about/index.qmd
        text: About

  page-footer:
    center:
      - icon: github
        href: https://github.com/bradfordjohnson
      - icon: linkedin
        href: https://linkedin.com/in/bradford-ford-johnson

format:
  html:
    # include-in-header:
      # - text: <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-W39B6FZ6');</script>
    # include-before-body:
      # - text: <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W39B6FZ6"height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    page-layout: full
    # anchor-sections: true
    theme: styles.scss
    toc: false
    canonical-url: true
    link-external-newwindow: true